<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyMentor Lab</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff;
        color: #111;
      }
      main {
        width: min(32rem, calc(100% - 3rem));
        border: 1px solid #111;
        padding: 2rem;
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }
      p {
        line-height: 1.6;
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PyMentor Lab</h1>
      <p>
        学生 Web 地址尚未配置。请运行
        <strong>PyMentorLab-Bootstrapper.exe</strong>
        完成后端部署，引导程序会自动将
        <code>PYMENTOR_DESKTOP_WEB_URL</code>
        设置为本地学生端地址（<code>http://127.0.0.1:4173</code>），随后重启本应用即可。
      </p>
      <p style="margin-top: 1rem; font-size: 0.9rem; color: #555;">
        如已通过其他方式部署，可手动设置系统环境变量：<br />
        <code>PYMENTOR_DESKTOP_WEB_URL=https://your-student-web.example.edu</code>
      </p>
    </main>
  </body>
</html>
