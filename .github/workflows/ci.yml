name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Frozen runtimes (PRD reversible assumptions): Node 20 LTS, Python 3.13.
# Backend owns lint/type/test + migration + contract parity + client freshness +
# docker build. Frontend lint/type/test is a placeholder until FE-001 lands.

jobs:
  backend-python:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    env:
      PYMENTOR_DATABASE_URL: postgresql+psycopg://pymentor:pymentor_dev@localhost:5432/pymentor
      PYMENTOR_BOOTSTRAP_ON_STARTUP: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pymentor
          POSTGRES_PASSWORD: pymentor_dev
          POSTGRES_DB: pymentor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pymentor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install dependencies
        run: uv venv -p 3.13 && uv pip install -e ".[dev]"
      - name: Run migrations
        run: uv run alembic -c backend/migrations/alembic.ini upgrade head
      - name: Ruff
        run: uv run ruff check backend sandbox
      - name: Mypy
        run: uv run mypy backend/app backend/tests sandbox
      - name: Pytest
        run: uv run pytest backend/tests sandbox/tests

  migrations:
    name: Migration round-trip
    runs-on: ubuntu-latest
    env:
      PYMENTOR_DATABASE_URL: postgresql+psycopg://pymentor:pymentor_dev@localhost:5432/pymentor
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pymentor
          POSTGRES_PASSWORD: pymentor_dev
          POSTGRES_DB: pymentor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pymentor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
      - run: uv python install 3.13
      - run: uv venv -p 3.13 && uv pip install -e ".[dev]"
      - name: Alembic upgrade/downgrade/upgrade
        run: |
          uv run alembic -c backend/migrations/alembic.ini upgrade head
          uv run alembic -c backend/migrations/alembic.ini downgrade base
          uv run alembic -c backend/migrations/alembic.ini upgrade head

  contracts-parity:
    name: Pydantic ↔ Zod conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
      - run: uv python install 3.13
      - run: uv venv -p 3.13 && uv pip install -e ".[dev]"
      - run: pnpm install --frozen-lockfile
      - name: Export Zod JSON Schemas + Zod conformance
        run: pnpm contracts:check
      - name: Pydantic parity
        run: uv run pytest backend/tests/test_contracts_parity.py -q

  api-client-freshness:
    name: Generated API client freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
      - run: uv python install 3.13
      - run: uv venv -p 3.13 && uv pip install -e ".[dev]"
      - run: pnpm install --frozen-lockfile
      - name: Regenerate and assert no diff
        working-directory: packages/api-client
        run: pnpm freshness

  typescript-workspace:
    name: TS workspace (typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Test
        run: pnpm -r run test

  docker-build:
    name: Docker build (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config --quiet
      - name: Build api image
        run: docker build -f infra/api.Dockerfile -t pymentor-api:ci .
