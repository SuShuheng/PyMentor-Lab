name: Bug report
description: Report a defect against an approved BE/FE/INT task
labels: ["bug"]
body:
  - type: input
    id: task
    attributes:
      label: Related task ID
      placeholder: "BE-003"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Commands, exit codes, platform
    validations:
      required: false
