# Alembic configuration for the PyMentor Lab API service.
# The actual database URL is read from the environment in env.py so that
# local/demo/production environments never need to edit this file.

[alembic]
script_location = backend/migrations
prepend_sys_path = .
path_separator = os
# Overridden by env.py via PYMENTOR_DATABASE_URL.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
