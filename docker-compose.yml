# PyMentor Lab local development stack.
#
# Pinned versions (frozen design §5.2): PostgreSQL 16, Redis 7, MinIO RELEASE
# image, Python 3.13, Node 20. `docker compose config` validates without a
# running daemon; full `up --build` requires Docker.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pymentor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pymentor_dev}
      POSTGRES_DB: ${POSTGRES_DB:-pymentor}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pymentor}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pymentor}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pymentor_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      PYMENTOR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pymentor}:${POSTGRES_PASSWORD:-pymentor_dev}@postgres:5432/${POSTGRES_DB:-pymentor}
      PYMENTOR_SERVICE_NAME: api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: infra/worker.Dockerfile
    environment:
      PYMENTOR_WORKER_PORT: "8081"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy

  sandbox:
    build:
      context: .
      dockerfile: infra/sandbox.Dockerfile
    # No network access to host mounts by default (isolation enforced in BE-005).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

volumes:
  pgdata:
  redisdata:
  miniodata:
