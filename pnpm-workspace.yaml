packages:
  - "apps/web"
  - "apps/admin"
  - "apps/desktop"
  - "workers/agent-worker"
  - "packages/ui"
  - "packages/charts"
  - "packages/config"
  - "packages/contracts"
  - "packages/api-client"
nodeLinker: hoisted
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  msgpackr-extract: false
overrides:
  "@electron/rebuild>@electron/node-gyp": "10.2.0-electron.2"
  "@electron-forge/plugin-fuses>@electron/fuses": "2.1.3"
  "handlebars@<=4.7.8": "4.7.9"
  "tar@<7.5.11": "7.5.11"
  "tmp@<0.2.7": "0.2.7"
